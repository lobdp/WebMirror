  </text>
  <text x="100" y="445" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="500" fill="#cbd5e1">
    Deep CSS @import &amp; font scraping · Self-healing placeholders · Zero broken assets
  </text>

  <!-- Bottom Badges / Creator credit -->
  <rect x="100" y="515" width="360" height="52" rx="14" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
  <circle cx="130" cy="541" r="16" fill="#0ea5e9" />
  <text x="122" y="546" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#ffffff">LD</text>
