  <text x="160" y="556" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" fill="#ffffff">Lob Das</text>

  <rect x="480" y="515" width="280" height="52" rx="14" fill="rgba(16,185,129,0.08)" stroke="rgba(16,185,129,0.25)" stroke-width="1" />
  <text x="505" y="547" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#34d399">✓ 100% Offline Ready</text>

  <rect x="780" y="515" width="320" height="52" rx="14" fill="rgba(56,189,248,0.08)" stroke="rgba(56,189,248,0.25)" stroke-width="1" />
  <text x="805" y="547" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#38bdf8">🌐 Unlimited Full Site Crawl</text>
