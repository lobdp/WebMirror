    <path d="M100 0 V630 M200 0 V630 M300 0 V630 M400 0 V630 M500 0 V630 M600 0 V630 M700 0 V630 M800 0 V630 M900 0 V630 M1000 0 V630 M1100 0 V630" stroke="#38bdf8" stroke-width="1" />
  </g>

  <!-- Ambient Glow Orbs -->
  <circle cx="280" cy="180" r="220" fill="#10b981" opacity="0.12" filter="url(#glow)" />
  <circle cx="920" cy="420" r="260" fill="#6366f1" opacity="0.12" filter="url(#glow)" />

  <!-- Brand Mark Squircle Icon -->
  <rect x="100" y="90" width="80" height="80" rx="22" fill="#0f172a" stroke="#10b981" stroke-width="3" stroke-opacity="0.6" />
  <path d="M124 116 L156 144 M138 144 L156 144 L156 126" stroke="url(#badge-grad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="125" cy="117" r="4" fill="#34d399" />

  <!-- Tag badge -->
  <rect x="204" y="108" width="220" height="44" rx="22" fill="#0f2922" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.4" />
  <circle cx="226" cy="130" r="5" fill="#10b981" />
  <text x="242" y="136" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#34d399" letter-spacing="1">v2.2 PRO AI-MIRROR</text>

  <!-- Main Headline -->
  <text x="100" y="260" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="900" fill="#ffffff" letter-spacing="-2">
    SiteClonePro
  </text>
  <text x="100" y="335" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" fill="url(#brand-grad)" letter-spacing="-1">
    Universal Offline Website Mirror
  </text>

  <!-- Description -->
  <text x="100" y="410" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="400" fill="#94a3b8">
