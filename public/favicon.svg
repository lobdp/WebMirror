<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="wm-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="wm-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#080c14" />
    </linearGradient>
    <filter id="wm-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#wm-bg)" stroke="#10b981" stroke-width="2" stroke-opacity="0.4" />
  
  <!-- Ambient Inner Glow -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="none" stroke="url(#wm-grad)" stroke-width="1.5" stroke-opacity="0.6" />

  <!-- WebMirror Geometric Mirror Glyphs -->
  <g filter="url(#wm-glow)">
    <!-- Top-left to bottom-right arrow -->
    <path d="M20 22 L44 42" stroke="url(#wm-grad)" stroke-width="4.5" stroke-linecap="round" />
    <path d="M30 42 L44 42 L44 28" stroke="url(#wm-grad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    
    <!-- Mirroring reflection dot / secondary pulse -->
    <circle cx="21" cy="23" r="3.5" fill="#34d399" />
    <circle cx="43" cy="41" r="2.5" fill="#38bdf8" />
  </g>
</svg>
